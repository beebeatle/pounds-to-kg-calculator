<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pounds to Kilograms Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Weight Converter</h1>
        <div class="converter">
            <h2>Pounds to Kilograms</h2>
            <input type="number" id="pounds" placeholder="Enter pounds">
            <button onclick="handlePoundsToKg()">Convert</button>
            <div id="pounds-to-kg-result"></div>
        </div>
        <div class="converter">
            <h2>Kilograms to Pounds</h2>
            <input type="number" id="kilograms" placeholder="Enter kilograms">
            <button onclick="handleKgToPounds()">Convert</button>
            <div id="kg-to-pounds-result"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
